name: Build Virkan Gym APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'build/virkan-gym-v1.9']

permissions:
  contents: read

concurrency:
  group: virkan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare reviewed source
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Import verified source bundle once
        id: source
        env:
          BUILD_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ -f .bootstrap/restore.py ]; then
            test "$BUILD_REF" = 'refs/heads/build/virkan-gym-v1.9' || {
              echo '::error::Bootstrap is restricted to the dedicated build branch'; exit 1;
            }
            python3 .bootstrap/restore.py
            python3 scripts/check-project.py
            node --test tests/logic.test.cjs
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add --all
            git commit -m 'Import readable Virkan Gym v1.9 sources and original emblem'
            git push origin HEAD:refs/heads/build/virkan-gym-v1.9
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build and verify APK
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Check project and web logic
        run: |
          python3 scripts/check-project.py
          node --check web/app.js
          node --check web/platform.js
          node --test tests/logic.test.cjs

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Install required Android SDK packages
        run: bash scripts/install-sdk.sh

      - name: Optional stable signing key
        env:
          KEYSTORE_B64: ${{ secrets.VIRKAN_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.VIRKAN_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VIRKAN_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.VIRKAN_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            test -n "$STORE_PASS" && test -n "$KEY_ALIAS" && test -n "$KEY_PASS" || {
              echo '::error::All four VIRKAN signing secrets are required'; exit 1;
            }
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/virkan-signing.jks"
            chmod 600 "$RUNNER_TEMP/virkan-signing.jks"
            echo "VIRKAN_KEYSTORE_PATH=$RUNNER_TEMP/virkan-signing.jks" >> "$GITHUB_ENV"
          fi

      - name: Build and lint debug APK
        env:
          VIRKAN_STORE_PASSWORD: ${{ secrets.VIRKAN_STORE_PASSWORD }}
          VIRKAN_KEY_ALIAS: ${{ secrets.VIRKAN_KEY_ALIAS }}
          VIRKAN_KEY_PASSWORD: ${{ secrets.VIRKAN_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug --stacktrace

      - name: Prepare verified APK and source archive
        run: |
          set -euo pipefail
          mkdir -p dist source-dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Virkan-Gym-1.9.0-debug.apk
          git rev-parse HEAD > dist/SOURCE_COMMIT.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/Virkan-Gym-1.9.0-debug.apk > dist/SIGNATURE.txt
          (cd dist && sha256sum Virkan-Gym-1.9.0-debug.apk > SHA256SUMS.txt)
          git archive --format=zip --output=source-dist/Virkan-Gym-1.9.0-source.zip HEAD
          echo '### Virkan Gym 1.9.0 — debug APK' >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the APK artifact below. Android compilation, web tests, lint and APK signature verification have completed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Installation and behavior on a physical phone still need testing. Export JSON before reinstalling.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Virkan-Gym-v1.9.0-debug
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Virkan-Gym-v1.9.0-source
          path: source-dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Virkan-Gym-build-reports
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/virkan-signing.jks"
